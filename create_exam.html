{% extends "base.html" %}

{% block content %}

<h1>Exam Management</h1>

<div class="card">

<form method="post">

<input
    type="text"
    name="title"
    placeholder="Exam title"
    required>

<input
    type="number"
    name="duration"
    placeholder="Duration in minutes"
    min="1"
    required>

<input
    type="number"
    name="question_limit"
    min="1"
    max="50"
    placeholder="Number of questions"
    required>

<button type="submit">Create Exam</button>

</form>

</div>

<h2>Exams</h2>

{% for e in exams %}

<div class="card row">

<b>{{ e.title }}</b>

<span>{{ e.duration }} min</span>

<span>{{ e.question_limit }} questions</span>

<a class="button"
   href="{{ url_for('admin_questions', exam_id=e.id) }}">
   Add Questions
</a>

<form method="post"
      action="{{ url_for('delete_exam', exam_id=e.id) }}"
      style="display:inline;">

<button type="submit"
        onclick="return confirm('Are you sure you want to delete this exam?');">
Delete Exam
</button>

</form>

</div>

{% endfor %}

{% endblock %}
